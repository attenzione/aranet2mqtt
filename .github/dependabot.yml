# Dependabot version updates, checked weekly on Friday at 05:00 UTC. Minor and
# patch updates come as one grouped pull request; majors come one by one.
#
# Cooldown: pnpm 11 rejects lockfile entries published less than a day ago
# (minimumReleaseAge), so `pnpm install --frozen-lockfile` in the Docker build
# would fail on a lockfile Dependabot wrote from brand-new releases.
version: 2
updates:
  - package-ecosystem: npm # pnpm: package.json and pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Tracks the Node 26 runtime in the Dockerfile; move both together by hand.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker # base images in the Dockerfile
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    ignore:
      # node:26 matches engines and @types/node; move majors by hand.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions # actions in .github/workflows
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
