# Publishes the Docker image to Docker Hub as <DOCKERHUB_USERNAME>/aranet2mqtt
# when a version tag is pushed: v1.2.3 becomes 1.2.3, 1.2 and latest.
#
# Each platform is built on its own native runner (no emulation for the Rust
# build) and pushed by digest; the publish job then joins the digests into one
# multi-platform tag.
#
# Needs the repository variable DOCKERHUB_USERNAME and the secret
# DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write).
#
# To republish a release, run it by hand and pick the tag under
# "Use workflow from".
name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/aranet2mqtt

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tag must name the version in package.json, which the app reports
      # as its own; a manual run from a branch stops here too.
      - name: Check the tag matches package.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$REF_NAME" != "$expected" ]; then
            echo "::error::Ref $REF_NAME is not $expected, the version in package.json"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # OCI labels (source, revision, version) for the image.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # Reads the layer cache CI keeps on main (amd64 only). Writes none: a
      # cache saved from a tag can't be read by the next tag.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-platform tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 → 1.2.3 and 1.2; latest is added for tags by default.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Join the digests under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
