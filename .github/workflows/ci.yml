# Checks every pull request: the code (lint, types, tests, build) and the
# Docker image (builds, the aranet CLI runs, the app answers /api/health).
#
# Draft pull requests are skipped; marking one ready for review runs the checks.
#
# Also runs on main after a merge, so the Docker layer cache lives on main and
# new pull requests start from it instead of compiling the aranet CLI again.
name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      # Node 22: the runtime in the Docker image.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Built for the runner's platform (amd64): it checks the Dockerfile and
      # the Rust build without emulating the Pi's arm64.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: aranet2mqtt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint aranet aranet2mqtt:ci --version
          docker run -d --name smoke -p 8080:8080 -e ARANET2MQTT_SOURCE=fake aranet2mqtt:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
